[package]
name = "flux-fluxgram"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "FluxGram: Telegram chats in Flux, an unofficial client through the Telegram API."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
flux-plugin-api = { git = "https://github.com/egor4geev/flux", rev = "406a379eb858f1f6cff52955f43f6760d5efec9b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Each account's database key: 32 random bytes, base64, in Flux's secrets.
getrandom = "0.3"
base64 = "0.22"
# The hidden chats' list (src/hidden.rs): a key derived from the phrase (PBKDF2-HMAC-SHA256)
# encrypts it (ChaCha20-Poly1305).
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = "1"

[features]
# Telegram's test servers with TDLib's example credentials (src/config.rs): development only.
test-dc = []

# Plugins are small: Flux compiles the component when it loads it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# A plugin is a project of its own: `cargo build --release --target wasm32-wasip2`.
[workspace]
