# The Russian interface of FluxGram: English text = translation. Flux translates the manifest's
# strings with this table too (the palette, Settings).

# The manifest
"Unofficial Telegram client: works through the Telegram API. Your chats and groups in Flux — several accounts, only the chats you add." = "Неофициальный клиент Telegram: работает через Telegram API. Ваши чаты и группы во Flux — несколько аккаунтов, только чаты, которые вы добавили."
"Add Telegram Account…" = "Добавить аккаунт Telegram…"
"Accounts" = "Аккаунты"
"Add Account" = "Добавить аккаунт"

# Settings → FluxGram and the window on the left
"No accounts yet." = "Аккаунтов пока нет."
"Sign Out" = "Выйти"
"Signing out…" = "Выход…"
"Sign out of {0}?" = "Выйти из аккаунта {0}?"
"FluxGram forgets this account on this computer; it stays in Telegram." = "FluxGram забудет этот аккаунт на этом компьютере; в Telegram он останется."
"Cancel" = "Отмена"
"Sign in to Telegram to see your chats here." = "Войдите в Telegram, чтобы видеть здесь свои чаты."
"Your chats come with the next FluxGram update." = "Чаты появятся в следующем обновлении FluxGram."

# The Add Account dialog
"FluxGram isn't set up to sign in to Telegram yet. An update of the plugin will bring it." = "FluxGram ещё не настроен для входа в Telegram. Это придёт с обновлением плагина."
"1. Open Telegram on your phone\n2. Go to Settings → Devices → Link Desktop Device\n3. Point the camera at the code" = "1. Откройте Telegram на телефоне\n2. Настройки → Устройства → Подключить устройство\n3. Наведите камеру на код"
"The code refreshes in {0} s" = "Код обновится через {0} с"
"Refreshing the code…" = "Код обновляется…"
"Getting the code…" = "Получаем код…"
"Use Phone Number" = "Войти по номеру телефона"
"Your phone number with the country code." = "Ваш номер телефона с кодом страны."
"Back" = "Назад"
"Next" = "Далее"
"Code" = "Код"
"Password" = "Пароль"
"Sign In" = "Войти"
"The account is protected with a password." = "Аккаунт защищён паролем."
"Hint: {0}" = "Подсказка: {0}"
"Telegram asks for an email address to send the codes to." = "Telegram просит почту, на которую будут приходить коды."
"The code sent to {0}." = "Код отправлен на {0}."
"This number has no Telegram account. Sign up in the Telegram app first, then add it here." = "У этого номера нет аккаунта Telegram. Сначала зарегистрируйтесь в приложении Telegram, потом добавьте его здесь."
"We've sent the code to Telegram on your other device." = "Код отправлен в Telegram на другом вашем устройстве."
"We've sent the code by SMS to {0}." = "Код отправлен в SMS на {0}."
"We're calling {0} to dictate the code." = "Звоним на {0}, чтобы продиктовать код."
"We're calling {0}: the code is the last digits of the calling number." = "Звоним на {0}: код — последние цифры номера, с которого звонят."
"We've sent the code to your anonymous number." = "Код отправлен на ваш анонимный номер."
"Type the code sent to {0}." = "Введите код, отправленный на {0}."
"Didn't get the code? You can also sign in with the QR code from your phone." = "Не пришёл код? Можно войти и по QR-коду с телефона."
"Sign In with QR Code" = "Войти по QR-коду"
"Send by SMS" = "Отправить по SMS"
"Call Me" = "Позвонить"
"Send Again" = "Отправить снова"
"Send by SMS in {0}" = "Отправить по SMS через {0}"
"Call Me in {0}" = "Позвонить через {0}"
"Send Again in {0}" = "Отправить снова через {0}"

# What went wrong
"Wrong code. Check it and try again." = "Неверный код. Проверьте и попробуйте ещё раз."
"The code has expired. Ask for a new one." = "Срок кода истёк. Запросите новый."
"Wrong password." = "Неверный пароль."
"That doesn't look like a phone number. Include the country code." = "Не похоже на номер телефона. Укажите его с кодом страны."
"Telegram doesn't let this number sign in." = "Telegram не пускает этот номер."
"Too many codes were asked for this number. Try again later." = "Для этого номера запрошено слишком много кодов. Попробуйте позже."
"That doesn't look like an email address." = "Не похоже на адрес почты."
"Telegram can't send the code another way now." = "Telegram сейчас не может отправить код другим способом."
"Too many attempts. Try again in a minute." = "Слишком много попыток. Попробуйте через минуту."
"Too many attempts. Try again in {0} min." = "Слишком много попыток. Попробуйте через {0} мин."
"Telegram refused FluxGram's app key. Update the plugin." = "Telegram не принял ключ приложения FluxGram. Обновите плагин."
"This account is already in FluxGram." = "Этот аккаунт уже есть в FluxGram."
"FluxGram lost its connection. Try again." = "FluxGram потерял соединение. Попробуйте ещё раз."
"Telegram couldn't do that: {0}" = "Telegram не смог это сделать: {0}"

# Notifications
"Signed in as {0}" = "Вы вошли как {0}"
"{0} was signed out" = "{0}: выход из аккаунта"
"The session was ended in Telegram." = "Сеанс завершён в Telegram."
"FluxGram keeps losing its connection" = "FluxGram то и дело теряет соединение"
"It reconnects by itself; the plugin's log has the details." = "Он подключается сам; подробности — в журнале плагина."
