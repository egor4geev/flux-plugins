[package]
name = "flux-remote"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false
description = "Flux Remote: Flux's Claude sessions from the phone, through the user's own Telegram bot."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
# Until the release: the SDK of the bot's Flux branch (API 0.6, `wt/bot/flux` beside this checkout);
# the release pins it by `rev`, as the other plugins.
flux-plugin-api = { git = "https://github.com/egor4geev/flux", rev = "5da5bdba4b396cd0a8a9c26e269758eba860e110" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The binding's one-time code.
getrandom = "0.3"

# Plugins are small: Flux compiles the component when it loads it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# A plugin is a project of its own.
[workspace]
