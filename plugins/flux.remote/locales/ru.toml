# The Russian interface of Flux Remote: English text = translation. Flux translates the manifest's
# strings with this table too (Settings, the Claude console); the bot writes to the user in Flux's
# interface language with it.

# The manifest
"Flux Remote" = "Flux Remote"
"Claude from your phone: your own Telegram bot runs Flux's Claude sessions — a topic per session, answers as they are written, permissions and questions by buttons." = "Claude с телефона: ваш собственный бот в Telegram ведёт сессии Claude во Flux — тема на сессию, ответы по мере печати, разрешения и вопросы кнопками."
"Continue in Telegram" = "Продолжить в Telegram"
"Bot" = "Бот"
"Bot Token" = "Токен бота"
"Make a bot with @BotFather in Telegram, turn on its topics there and paste its token here." = "Создайте бота в @BotFather в Telegram, включите там его темы и вставьте сюда токен."
"Connection" = "Подключение"
"Binding" = "Привязка"
"Computer" = "Компьютер"
"Don't sleep on the power adapter while the bot is on" = "Не спать на зарядке, пока включён бот"
"While remote sessions work, the computer stays awake anyway. A closed lid still puts a laptop to sleep." = "Пока работают удалённые сессии, компьютер не уснёт и так. Закрытая крышка усыпляет ноутбук в любом случае."

