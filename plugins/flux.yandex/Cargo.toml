[package]
name = "flux-yandex"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false
description = "Yandex Tracker and Calendar in Flux: tasks, work on a task, meetings."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
# Until the release: the SDK of the bot's Flux branch (API 0.6 — the task source, `wt/bot/flux`
# beside this checkout); the release pins it by `rev`, as the other plugins.
flux-plugin-api = { path = "../../../flux/crates/flux-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The sign-in's PKCE: a random verifier, its SHA-256 challenge in base64url.
base64 = "0.22"
getrandom = "0.3"
sha2 = { version = "0.10", default-features = false }

# Plugins are small: Flux compiles the component when it loads it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# A plugin is a project of its own: `cargo build --release --target wasm32-wasip2`.
[workspace]
