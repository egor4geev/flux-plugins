[package]
name = "flux-yandex"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Yandex Tracker and Calendar in Flux: tasks, work on a task, meetings."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
# The SDK of the Flux commit with plugin API 0.3 (part 10.3).
flux-plugin-api = { git = "https://github.com/egor4geev/flux", rev = "14bba127222980a9d57f3b5d6ec8b4a67eb967fc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The sign-in's PKCE: a random verifier, its SHA-256 challenge in base64url.
base64 = "0.22"
getrandom = "0.3"
sha2 = { version = "0.10", default-features = false }

# Plugins are small: Flux compiles the component when it loads it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# A plugin is a project of its own: `cargo build --release --target wasm32-wasip2`.
[workspace]
