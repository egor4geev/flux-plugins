# Rust for Flux (stage 8.3): moved out of Flux into the catalog. The grammar is the
# upstream tree-sitter grammar compiled to WebAssembly (`grammars.toml` says which); the highlighting
# query is the grammar's own (MIT).
id = "flux.rust"
name = "Rust"
version = "0.1.0"
api = "0.2"
authors = ["Egor Ageev"]
description = "Rust: highlighting, and rust-analyzer with errors, completion, navigation and refactoring."
repository = "https://github.com/egor4geev/flux-plugins"
icon = "icons/rust.svg"

[[languages]]
id = "rust"
name = "Rust"
extensions = ["rs"]
aliases = ["rs"]
grammar = "rust"
highlights = "languages/rust/highlights.scm"
icon = "icons/rust.svg"
icon-color = "orange"

[[grammars]]
id = "rust"
wasm = "grammars/rust.wasm"

[[language-servers]]
id = "rust-analyzer"
command = "rust-analyzer"
languages = ["rust"]
install = { rustup = "rust-analyzer", fallback = { github = "rust-lang/rust-analyzer", asset = "rust-analyzer-{arch}-apple-darwin.gz", bin = "rust-analyzer" } }
