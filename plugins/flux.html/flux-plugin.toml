# HTML for Flux (stage 8.3): a language of the catalog. The grammar is the upstream
# tree-sitter grammar compiled to WebAssembly (`grammars.toml` says which); the highlighting query
# is the grammar's own (MIT), adapted to the scopes Flux themes color — see its first lines.
id = "flux.html"
name = "HTML"
version = "0.1.0"
api = "0.2"
authors = ["Egor Ageev"]
description = "HTML: highlighting, and the HTML language server with errors, completion, hover and formatting."
repository = "https://github.com/egor4geev/flux-plugins"
icon = "icons/html.svg"

[[languages]]
id = "html"
name = "HTML"
extensions = ["html", "htm", "xhtml"]
aliases = ["htm", "xhtml"]
grammar = "html"
highlights = "languages/html/highlights.scm"
icon = "icons/html.svg"
icon-color = "orange"

[[grammars]]
id = "html"
wasm = "grammars/html.wasm"

# Formatting is off unless asked for; CSS in <style> and JavaScript in <script> get
# completion and errors from the server itself.
[[language-servers]]
id = "vscode-html-language-server"
command = "vscode-html-language-server"
args = ["--stdio"]
languages = ["html"]
initialization-options = { provideFormatter = true, embeddedLanguages = { css = true, javascript = true } }
install = { npm = ["vscode-langservers-extracted"], bin = "vscode-html-language-server" }
