# Flux Tiles (stage 8.3): a full-color set of file icons for the catalog — Flux's own glyphs in white
# on rounded tiles of the file types' colors. Generated by `src/gen-tiles.py` from Flux Icons (the
# bundled `flux.icons`), so both sets know the same files.
id = "flux.icons-tiles"
name = "Flux Tiles"
version = "0.1.0"
api = "0.2"
authors = ["Egor Ageev"]
description = "File icons as colored tiles: Flux's glyphs in white on the colors of their file types, readable on light and dark themes."
repository = "https://github.com/egor4geev/flux-plugins"
icon = "icons/tiles.svg"

[[icon-themes]]
file = "icon-themes/tiles.toml"
