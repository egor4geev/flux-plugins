# Classic Dark and Classic Light for Flux: a calm dark and light pair of color schemes, on Flux's glass.
# Tokens the themes don't name come from Flux Night (dark) and Flux Day (light): `docs/themes.md` in Flux.
# The id stays `flux.darcula` (the plugin's first name): installed copies update by it, and Flux still
# finds a theme chosen under its old name.
id = "flux.darcula"
name = "Classic Themes"
version = "0.2.0"
api = "0.2"
authors = ["Egor Ageev"]
description = "Classic Dark and Classic Light: calm color schemes — warm gray and white — on Flux's frosted glass. A dark and a light theme, a pair for Sync with OS."
repository = "https://github.com/egor4geev/flux-plugins"
icon = "icons/classic.svg"

[[themes]]
file = "themes/classic-dark.toml"

[[themes]]
file = "themes/classic-light.toml"
