# Darcula and IntelliJ Light for Flux: the dark and light schemes of JetBrains IDEs, on Flux's glass.
# Tokens the themes don't name come from Flux Night (dark) and Flux Day (light): `docs/themes.md` in Flux.
id = "flux.darcula"
name = "Darcula & IntelliJ Light"
version = "0.1.0"
api = "0.2"
authors = ["Egor Ageev"]
description = "Darcula and IntelliJ Light: the classic dark and light schemes of JetBrains IDEs on Flux's frosted glass. A dark and a light theme — a pair for Sync with OS."
repository = "https://github.com/egor4geev/flux-plugins"
icon = "icons/darcula.svg"

[[themes]]
file = "themes/darcula.toml"

[[themes]]
file = "themes/intellij-light.toml"
