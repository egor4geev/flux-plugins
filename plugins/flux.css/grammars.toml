# Where the grammars come from: the build compiles each into grammars/<id>.wasm
# (tree-sitter CLI 0.27.1, `tree-sitter build --wasm`).

[[grammars]]
id = "css"
repo = "https://github.com/tree-sitter/tree-sitter-css"
rev = "v0.25.0"  # dda5cfc5722c429eaba1c910ca32c2c0c5bb1a3f
path = "."

[[grammars]]
id = "scss"
repo = "https://github.com/savetheclocktower/tree-sitter-scss"
# Pulsar's SCSS grammar (no tags): the module system, `!default`, maps
rev = "f5dfc3b4609d01fb11af8c97f3948fffeff25e92"
path = "."

[[grammars]]
id = "less"
repo = "https://github.com/jimliang/tree-sitter-less"
# Its tags are older than the updates of 2024–2025 (tree-sitter 0.22+): the tip of master on 2025-10-30
rev = "e5ae6245f841b5778c79ac93b28fa4f56b679c5d"
path = "."
