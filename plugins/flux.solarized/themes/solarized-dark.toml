# Solarized Dark: base03 islands on a darker glass frame, Solarized's accents for meaning. What isn't
# named here comes from Flux Night.
name = "Solarized Dark"
appearance = "dark"

[ui]
frame = "#00212bcc"
frame_glow = "#268bd21f"
island = "#002b36eb"
island_border = "#93a1a11a"
sheen = "#fdf6e31f"
elevated = "#073642fa"
elevated_border = "#93a1a124"
divider = "#93a1a114"
foreground = "#93a1a1"
text_muted = "#839496"
dim = "#586e75"
text_disabled = "#45616b"
accent = "#268bd2"
accent_text = "#6cb6ec"
accent_soft = "#268bd22e"
on_accent = "#fdf6e3"
hover = "#93a1a114"
pressed = "#93a1a11f"
list_selected = "#268bd23d"
list_selected_inactive = "#93a1a11a"
input_background = "#00000033"
input_border = "#93a1a124"
focus_border = "#268bd2d9"
focus_ring = "#268bd23d"
drop_target = "#268bd229"
keycap = "#93a1a114"
keycap_border = "#93a1a126"
success = "#859900"
warning = "#b58900"
error = "#dc322f"
info = "#268bd2"
modified = "#cb4b16"
current_line = "#93a1a10d"
selection = "#268bd240"
cursor = "#93a1a1"
match_text = "#6cb6ec"
search_match = "#b5890038"
search_match_active = "#b589008f"
vcs_modified = "#268bd2"
vcs_added = "#859900"
vcs_deleted = "#657b83"
vcs_renamed = "#2aa198"
vcs_untracked = "#cb4b16"
vcs_conflict = "#dc322f"
graph_lanes = ["#268bd2", "#859900", "#6c71c4", "#cb4b16", "#2aa198", "#d33682", "#b58900", "#dc322f"]
blame_recent = "#268bd238"
blue = "#268bd2"
indigo = "#6c71c4"
violet = "#6c71c4"
pink = "#d33682"
red = "#dc322f"
orange = "#cb4b16"
amber = "#b58900"
lime = "#859900"
green = "#859900"
teal = "#2aa198"
cyan = "#2aa198"
folder = "#268bd2"

[syntax]
attribute = "#6c71c4"
boolean = "#d33682"
comment = { color = "#586e75", italic = true }
constant = "#cb4b16"
"constant.builtin" = "#d33682"
constructor = "#cb4b16"
embedded = "#839496"
escape = "#dc322f"
function = "#268bd2"
keyword = "#859900"
label = "#cb4b16"
number = "#d33682"
operator = "#859900"
property = "#6c71c4"
punctuation = "#657b83"
"punctuation.special" = "#dc322f"
string = "#2aa198"
"string.escape" = "#dc322f"
"string.special" = "#6c71c4"
tag = "#268bd2"
"text.literal" = "#2aa198"
"text.reference" = "#6c71c4"
"text.title" = { color = "#cb4b16", bold = true }
"text.uri" = "#268bd2"
type = "#b58900"
"type.builtin" = "#b58900"
variable = "#839496"
"variable.builtin" = "#cb4b16"
"variable.parameter" = "#b58900"

# The classic Solarized terminal table.
[terminal]
foreground = "#839496"
background = "#002b36"
cursor = "#93a1a1"
ansi = [
    "#073642", "#dc322f", "#859900", "#b58900", "#268bd2", "#d33682", "#2aa198", "#eee8d5",
    "#002b36", "#cb4b16", "#586e75", "#657b83", "#839496", "#6c71c4", "#93a1a1", "#fdf6e3",
]
