# Solarized Light: base3 islands on a base2 glass frame, the same accents as Solarized Dark. What
# isn't named here comes from Flux Day.
name = "Solarized Light"
appearance = "light"

[ui]
frame = "#eee8d5cc"
frame_glow = "#268bd21a"
island = "#fdf6e3f0"
island_border = "#586e751f"
sheen = "#ffffffd9"
elevated = "#fdf6e3ff"
elevated_border = "#586e7529"
divider = "#586e7517"
foreground = "#586e75"
text_muted = "#657b83"
dim = "#93a1a1"
text_disabled = "#b8c0bd"
accent = "#268bd2"
accent_text = "#1f6fb0"
accent_soft = "#268bd224"
on_accent = "#fdf6e3"
hover = "#586e750f"
pressed = "#586e751a"
list_selected = "#268bd22e"
list_selected_inactive = "#586e7517"
input_background = "#fdf6e3e6"
input_border = "#586e7526"
focus_border = "#268bd2d9"
focus_ring = "#268bd240"
drop_target = "#268bd22e"
keycap = "#586e750f"
keycap_border = "#586e7526"
shadow = "#586e7540"
backdrop = "#586e752e"
success = "#859900"
warning = "#b58900"
error = "#dc322f"
info = "#268bd2"
modified = "#cb4b16"
current_line = "#eee8d580"
selection = "#268bd230"
cursor = "#586e75"
match_text = "#1f6fb0"
search_match = "#b5890040"
search_match_active = "#b5890080"
vcs_modified = "#268bd2"
vcs_added = "#6f8000"
vcs_deleted = "#93a1a1"
vcs_renamed = "#1f8c84"
vcs_untracked = "#cb4b16"
vcs_conflict = "#dc322f"
graph_lanes = ["#268bd2", "#859900", "#6c71c4", "#cb4b16", "#2aa198", "#d33682", "#b58900", "#dc322f"]
blame_recent = "#268bd22e"
blue = "#268bd2"
indigo = "#6c71c4"
violet = "#6c71c4"
pink = "#d33682"
red = "#dc322f"
orange = "#cb4b16"
amber = "#b58900"
lime = "#859900"
green = "#859900"
teal = "#2aa198"
cyan = "#2aa198"
folder = "#268bd2"

[syntax]
attribute = "#6c71c4"
boolean = "#d33682"
comment = { color = "#93a1a1", italic = true }
constant = "#cb4b16"
"constant.builtin" = "#d33682"
constructor = "#cb4b16"
embedded = "#657b83"
escape = "#dc322f"
function = "#268bd2"
keyword = "#859900"
label = "#cb4b16"
number = "#d33682"
operator = "#859900"
property = "#6c71c4"
punctuation = "#586e75"
"punctuation.special" = "#dc322f"
string = "#2aa198"
"string.escape" = "#dc322f"
"string.special" = "#6c71c4"
tag = "#268bd2"
"text.literal" = "#2aa198"
"text.reference" = "#6c71c4"
"text.title" = { color = "#cb4b16", bold = true }
"text.uri" = "#268bd2"
type = "#b58900"
"type.builtin" = "#b58900"
variable = "#657b83"
"variable.builtin" = "#cb4b16"
"variable.parameter" = "#b58900"

[terminal]
foreground = "#657b83"
background = "#fdf6e3"
cursor = "#586e75"
ansi = [
    "#073642", "#dc322f", "#859900", "#b58900", "#268bd2", "#d33682", "#2aa198", "#eee8d5",
    "#002b36", "#cb4b16", "#586e75", "#657b83", "#839496", "#6c71c4", "#93a1a1", "#fdf6e3",
]
