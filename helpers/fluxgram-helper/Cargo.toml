[package]
name = "fluxgram-helper"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "FluxGram's program: TDLib behind JSON lines on stdin and stdout, a client per account."

[dependencies]
serde_json = "1"

# build.rs checks the downloaded archive of TDLib's static libraries against its pinned SHA-256.
[build-dependencies]
sha2 = "0.10"

# One file the plugin downloads: small and fast.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# A program of its own: `cargo build --release`.
[workspace]
